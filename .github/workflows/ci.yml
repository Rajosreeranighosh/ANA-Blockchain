name: Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build tools and GUI libraries (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgl1-mesa-dev libx11-dev libx11-xcb-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Configure MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Verify Rust formatting
        run: cargo fmt --all -- --check
      - name: Compile and test all targets (Ubuntu)
        if: runner.os == 'Linux'
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: cargo test --all-targets
      - name: Compile and test all targets (Windows)
        if: runner.os == 'Windows'
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: cargo test --all-targets
