name: Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build tools for RandomX (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
      - name: Add compatibility name for RandomX C++ runtime (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          # randomx-bindings-sys 0.1.5 hardcodes "libc++" as its link name.
          # Its RandomX static library is built with the runner's GNU toolchain,
          # so provide that runtime under the hardcoded name.
          GNU_CXX_RUNTIME="$(g++ -print-file-name=libstdc++.so)"
          test -f "$GNU_CXX_RUNTIME"
          sudo mkdir -p /usr/local/lib
          sudo ln -sf "$GNU_CXX_RUNTIME" /usr/local/lib/liblibc++.so
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Verify Rust formatting
        run: cargo fmt --all -- --check
      - name: Compile and test all targets (Ubuntu)
        if: runner.os == 'Linux'
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
          LIBRARY_PATH: /usr/local/lib
        run: cargo test --all-targets
      - name: Compile and test all targets (Windows)
        if: runner.os == 'Windows'
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: cargo test --all-targets
