name: Rust CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build tools for RandomX
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
      - name: Add compatibility name for RandomX C++ runtime
        run: |
          # randomx-bindings-sys 0.1.5 hardcodes "libc++" as its link name.
          # Its RandomX static library is built with the runner's GNU toolchain,
          # so provide that runtime under the hardcoded name.
          GNU_CXX_RUNTIME="$(g++ -print-file-name=libstdc++.so)"
          test -f "$GNU_CXX_RUNTIME"
          sudo mkdir -p /usr/local/lib
          sudo ln -sf "$GNU_CXX_RUNTIME" /usr/local/lib/liblibc++.so
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Commit formatting fixes to the PR branch
        if: github.ref != 'refs/heads/main'
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "Apply rustfmt formatting"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - name: Verify Rust formatting
        run: cargo fmt --all -- --check
      - name: Compile and test all targets
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
          LIBRARY_PATH: /usr/local/lib
        run: cargo test --all-targets
