name: Dependency security audit

on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  cargo-audit:
    name: Rust dependency advisory audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (stable toolchain action)
        with:
          toolchain: stable
      - name: Resolve dependencies
        run: cargo generate-lockfile
      - name: Report dependency paths for unmaintained crates
        shell: bash
        run: |
          # Include every target so Windows-only and platform-specific paths are
          # visible even when this audit job runs on Ubuntu.
          for crate in clear_on_drop paste ttf-parser; do
            echo "::group::Dependency path (all targets): $crate"
            cargo tree --locked --target all --invert "$crate" || true
            echo "::endgroup::"
          done
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Check RustSec advisories
        run: cargo audit --deny warnings
