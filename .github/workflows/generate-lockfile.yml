name: Generate Cargo.lock

on:
  push:
    branches:
      - ana-mtls-transport-v1

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: stable
      - name: Resolve and generate lockfile
        run: cargo generate-lockfile
      - name: Commit generated lockfile to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock is already up to date"
          else
            git commit -m "Commit Cargo.lock for reproducible builds"
            git push origin HEAD:ana-mtls-transport-v1
          fi
