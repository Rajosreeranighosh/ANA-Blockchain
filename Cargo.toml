[package]
name = "ana-blockchain"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "ANA experimental RandomX proof-of-work blockchain and testnet"

[dependencies]
anyhow = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
rand = "0.8"
rpassword = "7"
randomx-bindings = "0.1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
